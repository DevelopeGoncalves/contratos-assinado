<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contrato · Victorino Eng</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="img/logo_principal.png">
  <link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body>
  <header class="topbar no-print">
    <div class="brand">
      <a href="index.html"><img src="img/logo_horizontal.png" alt="Victorino Eng" class="logo-img"></a>
    </div>
    <nav>
      <a href="contratos.html">← Voltar</a>
      <a href="#" id="btn-sair">Sair</a>
    </nav>
  </header>

  <main class="container" id="app" style="display:none">
    <!-- Painel de edição (admin) -->
    <div class="card no-print" id="painel-edicao">
      <h2>Ajustar valores deste contrato</h2>
      <p class="desc">Você pode alterar os valores só deste cliente antes de gerar o PDF. Depois clique em <strong>Salvar</strong>.</p>
      <form id="form-valores">
        <div class="grid">
          <div class="field full"><label>Objeto (nome do software)</label><input name="objeto"></div>
          <div class="field"><label>Taxa de implementação (Setup) R$</label><input name="valorSetup" type="number" step="0.01"></div>
          <div class="field"><label>Mensalidade R$</label><input name="valorMensalidade" type="number" step="0.01"></div>
          <div class="field"><label>Dia de vencimento</label><input name="diaVencimento" type="number" min="1" max="28"></div>
          <div class="field"><label>Data de assinatura</label><input name="dataAssinatura" type="date"></div>
          <div class="field"><label>Cidade (foro/assinatura)</label><input name="cidadeAssinatura"></div>
          <div class="field"><label>UF</label><input name="ufAssinatura" maxlength="2" style="text-transform:uppercase"></div>
          <div class="field"><label>Carência (meses)</label><input name="fidelidadeMeses" type="number" min="1"></div>
          <div class="field"><label>Reajuste (% ao ano)</label><input name="reajustePercent" type="number" min="0"></div>
        </div>
        <div id="msg" class="banner ok" style="display:none;margin-top:14px"></div>
        <div class="actions" style="margin-top:14px">
          <button type="submit" class="btn btn-primary">💾 Salvar alterações</button>
          <button type="button" id="btn-pdf" class="btn btn-gold">🖨 Baixar PDF / Imprimir</button>
          <button type="button" id="btn-excluir" class="btn btn-ghost" style="margin-left:auto">🗑 Excluir</button>
        </div>
      </form>
    </div>

    <div id="doc-alvo"></div>
  </main>

  <div class="loading" id="carregando">Carregando…</div>
  <script type="module" src="js/contrato-admin.js?v=3"></script>
</body>
</html>
